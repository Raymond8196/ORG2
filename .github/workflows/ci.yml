# CI — runs on every pull request to develop / release / master.
#
# Three parallel jobs:
#   frontend  — TypeScript typecheck + ESLint + Vitest unit tests
#   rust      — cargo check + advisory clippy + cargo test
#   shell-replay-windows — Windows compile + targeted replay tests
#
# Mirrors the toolchain versions used in release.yaml (Node 20, pnpm 9,
# Rust stable, swatinem/rust-cache) so CI and release builds stay in sync.

name: "CI"

on:
  pull_request:
    branches:
      - develop
      - release
      - master

jobs:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (typecheck · lint · test)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm run test

  # ── Rust ────────────────────────────────────────────────────────────────────
  rust:
    name: Rust (check · clippy · test)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "ci-macos"

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --workspace

      # The current develop baseline has pre-existing Clippy warnings across
      # multiple crates. Keep Clippy visible and compilation-blocking without
      # letting toolchain lint drift block every feature PR; restore
      # `-- -D warnings` after the baseline cleanup lands.
      - name: cargo clippy (advisory warnings)
        working-directory: src-tauri
        run: cargo clippy --workspace

      - name: cargo test
        working-directory: src-tauri
        # Several agent-core tests intentionally exercise process-global SQLite
        # state. Keep the workspace suite deterministic until those fixtures are
        # migrated to per-test connections.
        run: cargo test --workspace -- --test-threads=1

  # ── Shell replay portability ───────────────────────────────────────────────
  # #425 changes the shell output file format and cleanup lifecycle. Keep a
  # real Windows compile + filesystem regression lane so path handling, file
  # deletion, range reads, and the external CLI import cannot silently become
  # macOS-only.
  shell-replay-windows:
    name: Shell replay (Windows)
    # Keep the required portability lane on the stable VS2022 image. The
    # floating windows-latest label currently resolves to Windows 2025 +
    # VS2026, where the agent_core test binary fails in the OS loader before
    # the Rust test harness starts (STATUS_ENTRYPOINT_NOT_FOUND).
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "ci-windows-2022-shell-replay"

      - name: Check shell replay dependency chain
        working-directory: src-tauri
        run: cargo check -p database -p session_persistence -p agent_core -p org2

      - name: Test bounded replay writer, reader, recovery, and cleanup
        working-directory: src-tauri
        run: cargo test -p agent_core shell_replay --lib -- --test-threads=1

      - name: Test external CLI durable replay import
        working-directory: src-tauri
        run: cargo test -p agent_core external_replay --lib -- --test-threads=1

      - name: Test external CLI parser through EventStore compaction
        working-directory: src-tauri
        run: cargo test -p org2 external_cli_shell_survives_parser_to_event_store_compaction --lib -- --test-threads=1
