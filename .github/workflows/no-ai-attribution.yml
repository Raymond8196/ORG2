# Merge guard: reject any PR whose commit history carries AI attribution
# trailers. Exists because develop's history was rewritten on 2026-07-30 to
# strip them — merging a branch based on the pre-rewrite develop would
# resurrect the old commits (and the attribution) wholesale. Rebase the
# branch onto current develop to pass.

name: No AI attribution

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan PR commits for attribution trailers
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          HITS=$(git log "${BASE}..HEAD" --grep='noreply@anthropic.com' --format='%h %s' || true)
          if [ -n "${HITS}" ]; then
            echo "::error::PR history contains AI attribution trailers (likely branched from pre-rewrite develop). Rebase onto current develop:"
            echo "${HITS}"
            exit 1
          fi
          echo "Clean."
